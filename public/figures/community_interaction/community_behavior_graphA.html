    <script type="text/javascript">
      function _allNodesArray(){
        return network.body.data.nodes.get();
      }

      function showAll(){
        var nodes = _allNodesArray();
        var upd = [];
        for (var i=0; i<nodes.length; i++){
          upd.push({id: nodes[i].id, hidden: false});
        }
        network.body.data.nodes.update(upd);
      }

      function showOnly(groupName){
        var nodes = _allNodesArray();
        var upd = [];
        for (var i=0; i<nodes.length; i++){
          var g = nodes[i].group || "";
          var hide = !(g === "Community" || g === groupName);
          upd.push({id: nodes[i].id, hidden: hide});
        }
        network.body.data.nodes.update(upd);
      }

      function restabilize(){
        try{
          network.setOptions({physics: {enabled: true}});
          network.stabilize(200);
        }catch(e){}
