    <style>
      .methodBtn, .stepBtn{
        border:1px solid #d0d0d0;
        background:white;
        color:#222;
        border-radius:10px;
        padding:7px 11px;
        cursor:pointer;
        font-size:13px;
      }

      .methodBtn:hover, .stepBtn:hover{
        background:#f2f2f2;
      }

      .methodBtnActive{
        background:#D62728 !important;
        color:white !important;
        border-color:#961E1E !important;
        font-weight:700;
      }

      .stepBtnActive{
        background:#333 !important;
        color:white !important;
        border-color:#111 !important;
        font-weight:700;
      }
    </style>

    <script type="text/javascript">
      var currentMethod = "imgreedy";
      var activeFrame = null;

      function _hideAllFrames(){
        var frames = document.getElementsByClassName("diffFrame");
        for (var i=0; i<frames.length; i++){
          frames[i].style.display = "none";
        }
      }

      function _hideAllStepTabs(){
        var tabs = document.getElementsByClassName("stepTabs");
        for (var i=0; i<tabs.length; i++){
          tabs[i].style.display = "none";
        }
      }

      function _clearMethodButtonActive(){
        var btns = document.getElementsByClassName("methodBtn");
        for (var i=0; i<btns.length; i++){
          btns[i].classList.remove("methodBtnActive");
          btns[i].setAttribute("aria-pressed", "false");
        }
      }

      function _clearStepButtonActive(methodId){
        var box = document.getElementById("stepTabs_" + methodId);
        if (!box){ return; }

        var btns = box.getElementsByClassName("stepBtn");
        for (var i=0; i<btns.length; i++){
          btns[i].classList.remove("stepBtnActive");
          btns[i].setAttribute("aria-pressed", "false");
        }
      }

      function _activateMethodButton(methodId){
        var btns = document.getElementsByClassName("methodBtn");
        for (var i=0; i<btns.length; i++){
          var txt = btns[i].innerText.toLowerCase()
            .replaceAll("-", "")
            .replaceAll("_", "")
            .replaceAll(" ", "");

          if (txt === methodId){
            btns[i].classList.add("methodBtnActive");
            btns[i].setAttribute("aria-pressed", "true");
          }
        }
      }

      function _refreshFrame(frame){
        if (!frame){ return; }

        setTimeout(function(){
          try{
            var cw = frame.contentWindow;
            if (cw && cw.enforceNodeColors){
              cw.enforceNodeColors();
            }
            if (cw && cw.showActivatedOnly){
              cw.showActivatedOnly();
            }
          }catch(e){}
        }, 150);
      }

      function _showFrame(frame){
        if (!frame){ return; }

        if (activeFrame && activeFrame !== frame){
          activeFrame.onload = null;
          activeFrame.src = "about:blank";
        }

        activeFrame = frame;
        frame.style.display = "block";
        var status = document.getElementById("frameStatus");

        if (frame.getAttribute("src") !== frame.dataset.src){
          status.hidden = false;
          status.textContent = "Loading selected diffusion graph…";
          frame.onload = function(){
            if (activeFrame === frame){
              status.hidden = true;
              _refreshFrame(frame);
            }
          };
          frame.src = frame.dataset.src;
        } else {
          status.hidden = true;
          _refreshFrame(frame);
        }
      }

      function showMethod(methodId){
        currentMethod = methodId;

        _hideAllFrames();
        _hideAllStepTabs();
        _clearMethodButtonActive();

        _activateMethodButton(methodId);

        var stepTab = document.getElementById("stepTabs_" + methodId);
        if (stepTab){
          stepTab.style.display = "flex";
        }

        _clearStepButtonActive(methodId);

        if (stepTab){
          var stepBtns = stepTab.getElementsByClassName("stepBtn");
          if (stepBtns.length > 0){
            stepBtns[0].classList.add("stepBtnActive");
            stepBtns[0].setAttribute("aria-pressed", "true");
          }
        }

        var frame = document.getElementById("frame_" + methodId + "_step_0");
        _showFrame(frame);
      }

      function showStep(methodId, stepId){
        currentMethod = methodId;
        _hideAllFrames();
        _clearStepButtonActive(methodId);

        var frame = document.getElementById("frame_" + methodId + "_step_" + stepId);
        _showFrame(frame);

        var stepTab = document.getElementById("stepTabs_" + methodId);
        if (stepTab){
          var btns = stepTab.getElementsByClassName("stepBtn");
          for (var i=0; i<btns.length; i++){
            if (btns[i].innerText.trim() === "Step-" + stepId){
              btns[i].classList.add("stepBtnActive");
              btns[i].setAttribute("aria-pressed", "true");
            }
          }
        }
      }

      window.addEventListener("DOMContentLoaded", function(){
        showMethod("imgreedy");
      });
    </script>
